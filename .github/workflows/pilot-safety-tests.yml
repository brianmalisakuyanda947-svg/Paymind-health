name: PayMind pilot safety tests

on:
  pull_request:
  push:
    branches:
      - main
      - pilot-readiness-audit-v1
      - add-invoice-export-v1
      - add-payment-claims-exports-v1

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run pilot safety tests
        run: node --test tests/*.test.cjs
